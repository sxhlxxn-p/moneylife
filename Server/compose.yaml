services:
  api:
    build:
      context: ..
      dockerfile: Server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://moneylife:moneylife@db:5432/moneylife}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:8000"
    volumes:
      - ./app:/app/Server/app
      - ./tests:/app/Server/tests
      - ../Engine/src:/app/Engine/src
      - ../.data/market:/app/.data/market:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moneylife}
      POSTGRES_USER: ${POSTGRES_USER:-moneylife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneylife}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
